name: Build OrbitPress APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests (user + admin flavors)
        run: ./gradlew :app:testUserDebugUnitTest :app:testAdminDebugUnitTest --no-daemon --stacktrace

      - name: Build user and admin APKs
        run: ./gradlew :app:assembleUserDebug :app:assembleAdminDebug --no-daemon --stacktrace

      - name: Upload user APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitPress-User-APK
          path: app/build/outputs/apk/user/debug/*.apk
          if-no-files-found: error

      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitPress-Admin-APK
          path: app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error
