name: Build OrbitPress APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon --stacktrace 2>&1 | tee app/build/unit-test.log || true

      - name: Report unit test failure
        if: always()
        run: |
          if grep -qiE "BUILD FAILED|FAILED|error:" app/build/unit-test.log 2>/dev/null || grep -rqi "<failure" app/build/test-results/testDebugUnitTest 2>/dev/null; then
            message="$(grep -aiE "FAILED|error:|BUILD FAILED|AssertionError|expected:|but was:|Could not|Unresolved reference|e: |What went wrong" app/build/unit-test.log | head -12)"
            if [ -z "$message" ]; then message="Unit tests failed. See raw workflow logs."; fi
            echo "::error::$message"
            exit 1
          fi

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitPress-debug-apk
          path: app/build/outputs/apk/debug/*.apk

