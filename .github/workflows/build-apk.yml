name: Build OrbitPress APK - Modern Efficient

on:
  workflow_dispatch:
    inputs:
      scraper_url:
        description: "ORBITPRESS_SCRAPER_URL baked into the APK (HTTPS). Leave empty to use the repository variable or the default."
        required: false
        default: ""
  push:
    branches:
      - main
      - arena/*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Build-time defaults for the VPS Scraper. The URL comes from the workflow input or the
      # repository variable ORBITPRESS_SCRAPER_URL (falls back to the sslip.io VPS). The key is
      # read ONLY from the repository secret ORBITPRESS_SCRAPER_KEY; when the secret is missing the
      # APK ships without a key and the user pastes it once in Settings.
      - name: Write .env for the build
        env:
          INPUT_URL: ${{ github.event.inputs.scraper_url }}
          VAR_URL: ${{ vars.ORBITPRESS_SCRAPER_URL }}
          SECRET_KEY: ${{ secrets.ORBITPRESS_SCRAPER_KEY }}
        run: |
          URL="${INPUT_URL:-${VAR_URL:-https://23.95.186.208.sslip.io}}"
          {
            echo "ORBITPRESS_SCRAPER_URL=${URL}"
            echo "ORBITPRESS_SCRAPER_KEY=${SECRET_KEY}"
          } > .env
          echo "Scraper URL baked into APK: ${URL}"
          if [ -z "${SECRET_KEY}" ]; then echo "::notice::ORBITPRESS_SCRAPER_KEY secret not set - APK ships without a default key (enter it in Settings)."; else echo "Scraper key: provided via secret"; fi

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --parallel --max-workers=4 --build-cache

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --parallel --build-cache

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --parallel --build-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitPress-debug-apk-v4.1.2
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitPress-release-apk-v4.1.2
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x ./gradlew
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
