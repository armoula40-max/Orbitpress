name: Build OrbitPress APK - Modern Efficient

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17 - Efficient
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK - Efficient
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android packages - Cached
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" --verbose
          sdkmanager --list_installed

      - name: Gradle cache - Efficient
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests - Efficient
        run: ./gradlew :app:testDebugUnitTest --no-daemon --parallel --max-workers=4 --build-cache --stacktrace

      - name: Build Debug APK - Modern Efficient
        run: ./gradlew :app:assembleDebug --no-daemon --parallel --max-workers=4 --build-cache --stacktrace -Pandroid.builder.sdkDownload=false

      - name: Build Release APK - Optimized with R8
        run: ./gradlew :app:assembleRelease --no-daemon --parallel --max-workers=4 --build-cache --stacktrace -Pandroid.builder.sdkDownload=false

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitPress-debug-apk-v4.1-modern
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          compression-level: 6

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitPress-release-apk-v4.1-modern
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          compression-level: 6

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

  # Additional job for efficient lint check
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x ./gradlew
      - run: ./gradlew :app:lintDebug --no-daemon --parallel --build-cache || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
