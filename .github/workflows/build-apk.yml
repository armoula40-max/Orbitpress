name: Build OrbitPress APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        continue-on-error: true
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --console=plain --no-daemon --stacktrace 2>&1 | tee app/build/unit-test.log
          test_status=${PIPESTATUS[0]}
          echo "UNIT_TEST_STATUS=$test_status" >> app/build/unit-test.log
          exit 0

      - name: Report unit test failure
        if: always()
        run: |
          TEST_STATUS=$(grep -oE "UNIT_TEST_STATUS=[0-9]+" app/build/unit-test.log | tail -1 | cut -d= -f2)
          if [ "$TEST_STATUS" != "0" ]; then
            message="$(grep -aiE "FAILED|error:|BUILD FAILED|What went wrong|AssertionError|expected:|but was:|Could not|Unresolved reference|e: |Exception" app/build/unit-test.log | head -20 | tr '\n' ' ')"
            if [ -z "$message" ]; then
              message="$(tail -n 60 app/build/unit-test.log | tr '\n' ' ')"
            fi
            if [ -z "$message" ]; then message="Unit tests failed with exit code $TEST_STATUS. See raw workflow logs."; fi
            echo "::error::$message"
            exit 1
          fi

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitPress-debug-apk
          path: app/build/outputs/apk/debug/*.apk

