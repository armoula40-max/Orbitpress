name: Build OrbitPress APK - Modern Efficient

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --build-cache

      - name: Show test results if failed
        if: failure()
        run: |
          find app/build -name "*.txt" -o -name "*.html" | head -n 20
          cat app/build/reports/tests/testDebugUnitTest/classes/*.html || true
          find app/build/test-results -name "*.xml" -exec cat {} \; | tail -n 200 || true

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --build-cache --stacktrace

      - name: Build Release APK with R8
        run: ./gradlew :app:assembleRelease --no-daemon --build-cache --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitPress-debug-apk-v4.1-modern
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitPress-release-apk-v4.1-modern
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x ./gradlew
      - run: ./gradlew :app:lintDebug --no-daemon --build-cache || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: warn
