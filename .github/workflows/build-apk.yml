name: Build OrbitPress APK - Modern Efficient

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Build Debug APK with log capture
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build-debug.log
          echo "Exit code: $?"
        continue-on-error: true
      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log
        continue-on-error: true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-debug.log
            build-release.log
            app/build/reports/
            app/build/outputs/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload Debug APK if exists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrbitPress-debug-apk-v4.1-modern
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
      - name: Upload Release APK if exists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrbitPress-release-apk-v4.1-modern
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x ./gradlew
      - name: Run unit tests with log
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --info 2>&1 | tee test.log
        continue-on-error: true
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            test.log
            app/build/reports/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: warn
